[workspace]
resolver = "2"
members = ["crates/sf-compare", "crates/sf-video", "crates/sf-dev", "crates/sf-host", "crates/sf-game", "crates/sf-engine", "crates/sf-openmpt", "crates/sf-audio", "crates/sf-art", "crates/sf-relay", "tools/mugen-extract"]

[workspace.package]
version = "1.5.28"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
sha1 = "0.10"
png = "0.17"
clap = { version = "4", features = ["derive"] }

# Debug builds keep file and line tables only: backtraces and panic locations
# stay exact, but the variable and type info that made each test's .pdb huge
# is left out.
[profile.dev]
debug = "line-tables-only"

# The full test suite emulates whole fights, which is many times slower
# unoptimized. `cargo suite` (.cargo/config.toml) builds it with this profile
# into target/suite; overflow checks and debug assertions stay on from dev.
[profile.suite]
inherits = "dev"
opt-level = 2
debug = 0
