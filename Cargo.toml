[workspace]
resolver = "2"
members = ["crates/sf-compare", "crates/sf-video", "crates/sf-dev", "crates/sf-host", "crates/sf-game", "crates/sf-engine", "crates/sf-openmpt", "crates/sf-audio", "crates/sf-art", "tools/mugen-extract"]

[workspace.package]
version = "1.4.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
sha1 = "0.10"
png = "0.17"
clap = { version = "4", features = ["derive"] }
